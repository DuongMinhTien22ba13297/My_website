<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <pattern id="am" width="40" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="40" height="10" fill="#fdfbf7"/>
      <rect width="10" height="10" fill="#b3261e"/>
      <rect x="20" width="10" height="10" fill="#1e40af"/>
    </pattern>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#f7f4ee"/>
    <rect width="64" height="12" fill="url(#am)"/>
    <text x="32" y="44" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#1f1b16" text-anchor="middle">DT</text>
  </g>
</svg>